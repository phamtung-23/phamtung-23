# Generates the rich stat images embedded in README.md, using lowlighter/metrics.
#
# ── One-time setup ────────────────────────────────────────────────────────────
# 1. Create a GitHub personal access token (classic):
#    https://github.com/settings/tokens  →  scopes: `repo`, `read:org`, `read:user`
#    (`repo` is what lets these images include private-repository activity, which is
#     where most of this account's commits live)
# 2. Add it to this repository: Settings → Secrets and variables → Actions →
#    New repository secret → name: METRICS_TOKEN
# 3. Also enable Settings → Public profile → "Include private contributions on my profile"
# 4. Run this workflow once: Actions → Metrics → Run workflow
# 5. Then uncomment the metrics block at the bottom of README.md
# ─────────────────────────────────────────────────────────────────────────────

name: Metrics

on:
  schedule: [{cron: "0 17 * * *"}] # 00:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Header, activity, community, repositories + full-year isometric commit calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: phamtung-23
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user

      # Languages actually used (public + private) and coding habits
      - name: Languages and habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: phamtung-23
          filename: metrics/skills.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugins_errors_fatal: no
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used, recently-used
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

      # GitHub achievements, rank B and above
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: phamtung-23
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugins_errors_fatal: no
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
